<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Carter DOOH mark — isometric cube in navy -->
  <!-- Top face -->
  <polygon points="32,4 58,18 32,32 6,18" fill="#12297D"/>
  <!-- Right face -->
  <polygon points="58,18 58,46 32,60 32,32" fill="#0e1f5e"/>
  <!-- Left face -->
  <polygon points="6,18 6,46 32,60 32,32" fill="#1a3aa8"/>
  <!-- Edge highlights -->
  <polyline points="6,18 32,32 58,18" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="32" y1="32" x2="32" y2="60" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
